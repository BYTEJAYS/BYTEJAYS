<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .scan { animation: sweep 6s linear infinite; }
      .name { animation: rise 1.1s cubic-bezier(.16,1,.3,1) .05s both; }
      .sub  { animation: rise 1.1s cubic-bezier(.16,1,.3,1) .30s both; }
      .tag  { animation: rise 1.1s cubic-bezier(.16,1,.3,1) .55s both; }
      .brac { animation: dim  4s ease-in-out infinite alternate; }
      .dot1 { animation: dim  3s ease-in-out .0s infinite alternate; }
      .dot2 { animation: dim  3s ease-in-out .4s infinite alternate; }
      .dot3 { animation: dim  3s ease-in-out .8s infinite alternate; }

      @keyframes sweep {
        0%   { transform: translateY(-28px); }
        100% { transform: translateY(248px); }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(7px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes dim {
        from { opacity: .35; }
        to   { opacity: .95; }
      }
    </style>

    <radialGradient id="bg" cx="450" cy="110" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#131026"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-22%" y="-50%" width="144%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ag" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r=".65" fill="#ffffff" opacity=".065"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#dots)"/>

  <!-- Sweeping scan line -->
  <rect class="scan" x="0" y="0" width="900" height="28" fill="url(#sg)"/>

  <!-- Corner bracket TL -->
  <path class="brac" d="M24 24 V62 M24 24 H62"
        stroke="#a78bfa" stroke-width="1.5" fill="none" filter="url(#ag)"/>
  <!-- Corner bracket TR -->
  <path class="brac" d="M876 24 V62 M876 24 H838"
        stroke="#a78bfa" stroke-width="1.5" fill="none" filter="url(#ag)"/>
  <!-- Corner bracket BL -->
  <path class="brac" d="M24 196 V158 M24 196 H62"
        stroke="#a78bfa" stroke-width="1.5" fill="none" filter="url(#ag)"/>
  <!-- Corner bracket BR -->
  <path class="brac" d="M876 196 V158 M876 196 H838"
        stroke="#a78bfa" stroke-width="1.5" fill="none" filter="url(#ag)"/>

  <!-- Top-left system label -->
  <text x="34" y="44"
        font-family="'Courier New', Courier, monospace"
        font-size="9" letter-spacing="2.5"
        fill="#a78bfa" opacity=".42">BYTEJAYS.sys</text>

  <!-- Top-right macOS-style traffic lights -->
  <circle class="dot1" cx="824" cy="36" r="4.5" fill="#ff5f57"/>
  <circle class="dot2" cx="841" cy="36" r="4.5" fill="#febc2e"/>
  <circle class="dot3" cx="858" cy="36" r="4.5" fill="#28c840"/>

  <!-- Header rule -->
  <line x1="24" y1="56" x2="876" y2="56"
        stroke="#a78bfa" stroke-width=".3" opacity=".14"/>

  <!-- Main name -->
  <text class="name"
        x="450" y="118"
        text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="14"
        fill="#ede9ff"
        filter="url(#glow)">BYTEJAYS</text>

  <!-- Role subtitle -->
  <text class="sub"
        x="450" y="150"
        text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" font-weight="400" letter-spacing="5"
        fill="#a78bfa">AI ENGINEER  ·  BUILDER  ·  INDIA</text>

  <!-- Tagline -->
  <text class="tag"
        x="450" y="180"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10.5" letter-spacing=".4"
        fill="#4b5263">building intelligent systems that see what humans miss</text>

  <!-- Footer rule -->
  <line x1="160" y1="196" x2="740" y2="196"
        stroke="#a78bfa" stroke-width=".3" opacity=".12"/>

  <!-- Footer labels -->
  <text x="34" y="214"
        font-family="'Courier New', Courier, monospace"
        font-size="8" letter-spacing="1.2"
        fill="#4b5263" opacity=".55">v2.0.25</text>

  <text x="866" y="214" text-anchor="end"
        font-family="'Courier New', Courier, monospace"
        font-size="8" letter-spacing="1.2"
        fill="#4b5263" opacity=".55">IN ◈</text>
</svg>
